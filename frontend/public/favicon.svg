<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradient violeta/blau idèntic al botó i menú actiu de la UI -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>

  <!-- Fons quadrat amb el gradient principal de ChromaFix -->
  <rect width="512" height="512" rx="112" fill="url(#brandGradient)" />

  <!-- Lletres CF en blanc i mida gegant -->
  <text 
    x="50%" 
    y="51%" 
    dominant-baseline="central" 
    text-anchor="middle" 
    fill="#FFFFFF" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-weight="900" 
    font-size="340" 
    letter-spacing="-14">
    CF
  </text>
</svg>
